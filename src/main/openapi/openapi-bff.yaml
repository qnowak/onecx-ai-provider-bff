---
openapi: 3.0.3
info:
  title: onecx-ai-provider  service
  version: 1.0.0
servers:
  - url: "http://onecx-ai-provider-svc:8080"
tags:
  - name: provider
  - name: agent
  - name: tool
  - name: model
  - name: scaffold
  - name: skill
  - name: agentGroup
  - name: externalAgent
  - name: dangerPattern
  - name: dispatch
paths:
  /dispatch/chat:
    post:
      x-onecx:
        permissions:
          agents:
            - dispatch
      tags:
        - dispatch
      summary: Chat with AI
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "404":
          description: No agent found for the request (AGENT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "502":
          description: AI runtime returned an error or an invalid response (RUNTIME_ERROR, RUNTIME_INVALID_RESPONSE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "503":
          description: AI runtime unavailable, retryable (RUNTIME_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'
        "504":
          description: AI runtime timed out, retryable (RUNTIME_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'

  /agents:
    post:
      x-onecx:
        permissions:
          agents:
            - write
      tags:
        - agent
      description: Create an Agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        "201":
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailResponse'

  /agents/{id}:
    get:
      x-onecx:
        permissions:
          agents:
            - read
      tags:
        - agent
      description: Get Agent
      operationId: getAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        "404":
          description: Not found
    delete:
      x-onecx:
        permissions:
          agents:
            - delete
      tags:
        - agent
      description: Delete Agent
      operationId: deleteAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Agent deleted
    put:
      x-onecx:
        permissions:
          agents:
            - write
      tags:
        - agent
      description: Update an Agent
      operationId: updateAgent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        "200":
          description: Agent updated successfully
          content:
            application/json:
