  /agents/{agentId}/tools/{toolId}/mcp-tool-rules:
    get:
      x-onecx:
        permissions:
          tools:
            - read
      tags:
        - agent
      description: Get MCP tool rules for an Agent and Tool
      operationId: getAgentMcpToolRules
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: toolId
          in: path
          required: true
          schema:
