      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMcpToolRuleList'
        "404":
          description: Agent or Tool not found

    put:
      x-onecx:
        permissions:
          tools:
            - write
      tags:
        - agent
      description: Update MCP tool rules for an Agent and Tool
      operationId: updateAgentMcpToolRule
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
        - name: toolId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpdateAgentMcpToolRuleRequest'
      responses:
        "200":
          description: Rules updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMcpToolRuleList'
        "404":
